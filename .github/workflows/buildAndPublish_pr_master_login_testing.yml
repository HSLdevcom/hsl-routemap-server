name: Build and publish Docker Hub image (login_testing) on PR to master

on:
  pull_request:
    branches:
      - 'master'

jobs:
  build-container:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.KARTAT_DOCKERHUB_USER }}
          password: ${{ secrets.KARTAT_DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          tags: hsldevcom/hsl-routemap-server:login_testing
          build-args: |
            BUILD_ENV=dev
            DIGITRANSIT_APIKEY=${{ secrets.KARTAT_DIGITRANSITAPIKEY_DEV }}
